<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>王先生 · 简历</title>
  <meta name="description" content="王先生的简历需要访问密码。">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%231c1915'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='16' fill='%23f7f4ee' font-family='serif'%3E王%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div class="gate" id="gate">
    <form id="unlock">
      <p class="kicker">Resume</p>
      <h1>王先生</h1>
      <p class="role">简历访问</p>
      <p>请输入访问密码。密码由候选人单独提供，不会写在链接里。打开后可预览完整版，并下载 PDF。</p>
      <label for="password">访问密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">打开简历</button>
      <p class="error" id="error" role="alert"></p>
    </form>
  </div>

  <div class="viewer is-hidden" id="viewer">
    <div class="toolbar">
      <button type="button" id="show-full" class="is-active">完整版</button>
      <button type="button" id="show-brief">简版 · 招聘平台</button>
      <a id="download" href="#">下载完整版 PDF</a>
      <p id="hint">完整版与附件一致，供人事预览和下载。</p>
      <button type="button" id="lock">锁定</button>
    </div>
    <div id="resume"></div>
  </div>

  <script>
    const gate = document.querySelector("#gate");
    const viewer = document.querySelector("#viewer");
    const form = document.querySelector("#unlock");
    const error = document.querySelector("#error");
    const resume = document.querySelector("#resume");
    const hint = document.querySelector("#hint");
    const download = document.querySelector("#download");
    const showFull = document.querySelector("#show-full");
    const showBrief = document.querySelector("#show-brief");
    let pack;
    let fullHtml = "";
    let briefHtml = "";
    let pdfUrl = "";

    function bytesFrom(b64) {
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i += 1) out[i] = bin.charCodeAt(i);
      return out;
    }

    async function deriveKey(password, salt, iterations) {
      const baseKey = await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(password),
        "PBKDF2",
        false,
        ["deriveKey"],
      );
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations, hash: "SHA-256" },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"],
      );
    }

    async function decrypt(key, part) {
      const buf = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: bytesFrom(part.iv) },
        key,
        bytesFrom(part.data),
      );
      return new Uint8Array(buf);
    }

    function show(view) {
      resume.innerHTML = view === "brief" ? briefHtml : fullHtml;
      showFull.classList.toggle("is-active", view !== "brief");
      showBrief.classList.toggle("is-active", view === "brief");
      hint.textContent = view === "brief"
        ? "简版供 Boss 直聘等招聘平台使用。下载文件仍是完整版。"
        : "完整版与附件一致，供人事预览和下载。";
      window.scrollTo(0, 0);
    }

    async function openResume(password) {
      if (!pack) pack = await fetch("sealed.json").then((res) => res.json());
      const key = await deriveKey(password, bytesFrom(pack.salt), pack.iter);
      fullHtml = new TextDecoder().decode(await decrypt(key, pack.full));
      briefHtml = new TextDecoder().decode(await decrypt(key, pack.brief));
      const pdfBytes = await decrypt(key, pack.pdf);
      if (pdfUrl) URL.revokeObjectURL(pdfUrl);
      pdfUrl = URL.createObjectURL(new Blob([pdfBytes], { type: "application/pdf" }));
      download.href = pdfUrl;
      download.download = pack.pdf.filename;
      sessionStorage.setItem("resume-password", password);
      gate.classList.add("is-hidden");
      viewer.classList.remove("is-hidden");
      show("full");
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      error.textContent = "";
      const button = form.querySelector("button");
      const password = new FormData(form).get("password").toString();
      button.disabled = true;
      button.textContent = "正在打开…";
      try {
        await openResume(password);
      } catch (err) {
        error.textContent = "密码不正确";
        button.disabled = false;
        button.textContent = "打开简历";
      }
    });

    showFull.addEventListener("click", () => show("full"));
    showBrief.addEventListener("click", () => show("brief"));
    document.querySelector("#lock").addEventListener("click", () => {
      sessionStorage.removeItem("resume-password");
      location.reload();
    });

    const saved = sessionStorage.getItem("resume-password");
    if (saved) {
      openResume(saved).catch(() => sessionStorage.removeItem("resume-password"));
    }
  </script>
</body>
</html>
